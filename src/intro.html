<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunbit Game Engine</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            background-color: #000000;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <canvas id="mainGameRender" width="0" height="0"></canvas>
    </div>

    <!-- Tauri entry point -->
    <script type="module" src="heavensgate.js"></script>
    <!-- Engine initialisation and state machine -->
    <script type="module" src="engine/engine.js"></script>
    <!-- UI screens -->
    <script type="module" src="ui/intro.js"></script>
    <script type="module" src="ui/dashboard.js"></script>
    <script type="module" src="ui/newgameplaceholder.js"></script>
    <script type="module" src="ui/ingamemenu.js"></script>
    <!-- Debug tooling (isolated from player-facing UI) -->
    <script type="module" src="debug/panels/bunbitdebug.js"></script>
    <!-- Start the engine lifecycle -->
    <script type="module">
        import { engineController } from './engine/engine.js';
        if (typeof window !== 'undefined') {
            window.addEventListener('DOMContentLoaded', () => {
                engineController.start();
            });
        }
    </script>
</body>

</html>
