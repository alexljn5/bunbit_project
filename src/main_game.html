<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesgame.css">
    <link rel="preload" href="img/fonts/boldpixels/BoldsPixels.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="shortcut icon" href="img/logo/favicon.ico">
    <title></title>
</head>

<body>
    <div class="game-container">
        <canvas id="mainGameRender" width="0" height="0"></canvas>
    </div>
    <!-- Tauri entry point -->
    <script type="module" src="heavensgate.js"></script>
    <!-- Global display scaling layer (800x800 logical → letterboxed display) -->
    <script type="module" src="rendering/display.js"></script>
    <!-- Engine initialisation and state machine -->
    <script type="module" src="engine/engine.js"></script>
    <!-- Core game modules -->
    <script type="module" src="game_loop.js"></script>
    <script type="module" src="playerdata/playerlogic.js"></script>
    <script type="module" src="./rendering/renderengine.js"></script>
    <!-- UI screens -->
    <script type="module" src="ui/dashboard.js"></script>
    <script type="module" src="ui/newgameplaceholder.js"></script>
    <script type="module" src="ui/ingamemenu.js"></script>
    <script type="module" src="ui/dialogue.js"></script>
    <script type="module" src="ui/gameplay.js"></script>
    <!-- Debug tooling (isolated from player-facing UI) -->
    <script type="module" src="debug/panels/bunbitdebug.js"></script>
    <script>
        // Disable intro animation on main_game.html - it was already shown on intro.html
        window.introActive = false;
        // Preload the global font so canvas text rendering can use it immediately
        import('./globals.js').then(m => m.preloadGlobalFont()).catch(() => { });
        // Start the engine lifecycle. The intro handler will detect that
        // introActive is false and skip directly to DASHBOARD.
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.engineController !== 'undefined') {
                window.engineController.start();
            }
        });
    </script>
</body>

</html>
