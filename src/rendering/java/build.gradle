plugins {
    id 'java'
    id 'org.teavm' version '0.14.1'
}

group 'com.bunbit'
version '0.1.0'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation teavm.libs.jso
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

teavm {
    all {
        // Build the helper kernel (fastSin/fastCos/...)
        // NOTE: TeaVM only keeps/export reachable code from the configured entry.
        mainClass = 'com.bunbit.render.RaycastMathKernel'

        outputDir = file('../../wasm/generated')


    }


    // Build the raycast batch PoC as part of the same TeaVM run.
    // Teavm plugin may not support multiple entry blocks; we rely on @JSExport
    // methods being included in the same wasm output.
    // (If later you want a dedicated entry, switch to a second teavm block supported by your plugin.)



    wasmGC {
        targetFileName = 'bunbit-renderhelpers.wasm'

        copyRuntime = true
        obfuscated = false
        debugInformation = true
    }
}

tasks.assemble.dependsOn(tasks.buildWasmGC)
