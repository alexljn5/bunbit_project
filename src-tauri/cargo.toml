[package]
name = "bunbit"
version = "0.0.5"
edition = "2021"
description = "Bunbit Game Engine - A raycasting-based first-person game"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

[features]
# This feature is used for production builds
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
strip = true
opt-level = "s"